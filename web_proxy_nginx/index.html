<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Math Island - Classroom Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --water: #2980b9; --land: #f1c40f; --empty: #3498db; }
        body { font-family: 'Kanit', sans-serif; background: #2c3e50; margin: 0; display: flex; height: 100vh; color: white; overflow: hidden; }
        .hidden { display: none !important; }

        /* --- Sidebar ข้อมูลผู้เล่น --- */
        #sidebar { width: 300px; background: rgba(0,0,0,0.8); padding: 20px; border-right: 2px solid #444; overflow-y: auto; }
        .player-card { 
            background: #444; border-radius: 10px; padding: 15px; margin-bottom: 15px; 
            border: 3px solid transparent; position: relative; transition: 0.3s;
        }
        .player-card.active { border-color: #f1c40f; transform: scale(1.02); box-shadow: 0 0 15px #f1c40f; }
        .player-card h3 { margin: 0; font-size: 18px; }
        .player-card .money { color: #2ecc71; font-weight: bold; font-size: 20px; }
        .player-card .pos-info { font-size: 12px; color: #bdc3c7; }
        .player-card .items { font-size: 11px; margin-top: 5px; color: #e67e22; }
        .dice-icon { position: absolute; right: 10px; top: 10px; font-size: 24px; animation: bounce 0.5s infinite alternate; }

        /* --- พื้นที่กระดานเกม --- */
        #main-game { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--water); position: relative; }
        #board-container { 
            display: grid; 
            grid-template-columns: repeat(11, 60px); 
            grid-template-rows: repeat(11, 60px); 
            gap: 2px; padding: 10px; border: 5px solid #1a5276; border-radius: 15px;
        }
        
        .block { background: #ecf0f1; border: 1px solid #000; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; color: #333; position: relative; font-weight: bold; }
        .block.water { background: var(--empty); border: none; color: transparent; }

        .center-area { grid-column: 2 / 11; grid-row: 2 / 11; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
        .player-token { width: 16px; height: 16px; border-radius: 50%; border: 2px solid white; position: absolute; bottom: 5px; transition: all 0.5s ease; z-index: 10; }
        .btn-roll { background: #e67e22; color: white; padding: 10px 30px; border: none; border-radius: 50px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="lobby-view" style="position: absolute; width: 100%; height: 100%; background: #2c3e50; z-index: 100; display: flex; align-items: center; justify-content: center;">
        <div style="background: white; color: #333; padding: 30px; border-radius: 20px; width: 400px; text-align: center;">
            <h2>🏝️ MATH ISLAND SETUP</h2>
            <div id="setup-offline">
                <label>จำนวนนักเรียน (2-6 คน):</label>
                <input type="number" id="off-count" value="2" min="2" max="6" style="width: 50px; padding: 5px;">
                <div id="off-names-list" style="margin: 15px 0;"></div>
                <button class="btn-roll" onclick="startOfflineGame()">เริ่มเกมในห้องเรียน</button>
            </div>
        </div>
    </div>

    <div id="sidebar" class="hidden">
        <h2 style="text-align: center;">เกาะคณิตศาสตร์</h2>
        <div id="player-status-container"></div>
    </div>

    <div id="main-game" class="hidden">
        <div id="board-container">
            <div class="center-area">
                <div id="dice-result" style="font-size: 40px; margin-bottom: 10px;">🎲 ? 🎲</div>
                <button class="btn-roll" onclick="handleRoll()">ทอยลูกเต๋า</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let players = [];
        let turn = 0;
        let boardConfig = {};
        let realBlockIds = []; // เก็บเฉพาะ ID ของบล็อกที่ไม่ใช่น้ำ

        function renderOffNames() {
            const count = document.getElementById('off-count').value;
            const container = document.getElementById('off-names-list');
            container.innerHTML = '';
            for(let i=1; i<=count; i++) {
                container.innerHTML += `<input type="text" class="off-p-name" value="นักเรียน ${i}" style="width: 80%; margin-bottom: 5px;"><br>`;
            }
        }
        renderOffNames();
        document.getElementById('off-count').addEventListener('change', renderOffNames);

        function startOfflineGame() {
            const inputs = document.querySelectorAll('.off-p-name');
            players = Array.from(inputs).map((inp, i) => ({
                id: i, name: inp.value, money: 10000, posIndex: 0, 
                items: ["บัตรเงินเดือน +10%"], color: getCol(i)
            }));
            socket.emit('getBoardConfig');
        }

        socket.on('sendBoardConfig', (config) => {
            boardConfig = config;
            // หาว่าบล็อกไหนไม่ใช่ 'empty' บ้าง
            realBlockIds = Object.keys(boardConfig).filter(id => boardConfig[id].type !== 'empty');
            
            document.getElementById('lobby-view').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('main-game').classList.remove('hidden');
            initBoard();
            updateUI();
        });

        function initBoard() {
            const container = document.getElementById('board-container');
            const size = 11;
            let coords = [];
            for(let i=1; i<=size; i++) coords.push({r:1, c:i});
            for(let i=2; i<=size; i++) coords.push({r:i, c:size});
            for(let i=size-1; i>=1; i--) coords.push({r:size, c:i});
            for(let i=size-1; i>=2; i--) coords.push({r:i, c:1});

            coords.forEach((coord, index) => {
                const bId = index + 1;
                const data = boardConfig[bId];
                const div = document.createElement('div');
                div.className = `block ${data.type === 'empty' ? 'water' : ''}`;
                div.id = `block-${bId}`;
                div.style.gridRow = coord.r;
                div.style.gridColumn = coord.c;
                if(data.type !== 'empty') {
                    div.innerHTML = `<span style="font-size:8px;">${data.name}</span><br><span style="font-size:7px;">B-${bId}</span>`;
                }
                container.appendChild(div);
            });
            updateTokens();
        }

        function handleRoll() {
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            const total = d1 + d2;
            document.getElementById('dice-result').innerText = `🎲 ${d1} + ${d2}`;

            let p = players[turn];
            // เดินเฉพาะใน realBlockIds
            p.posIndex = (p.posIndex + total) % realBlockIds.length;
            
            updateTokens();
            turn = (turn + 1) % players.length;
            updateUI();
        }

        function updateUI() {
            const container = document.getElementById('player-status-container');
            container.innerHTML = '';
            players.forEach((p, i) => {
                const isActive = (i === turn);
                const currentBlockId = realBlockIds[p.posIndex];
                container.innerHTML += `
                    <div class="player-card ${isActive ? 'active' : ''}">
                        ${isActive ? '<div class="dice-icon">🎲</div>' : ''}
                        <h3>${p.name}</h3>
                        <div class="money">฿ ${p.money.toLocaleString()}</div>
                        <div class="pos-info">📍 อยู่ที่: Block ${currentBlockId}</div>
                        <div class="items">🎒 ไอเทม: ${p.items.join(', ')}</div>
                    </div>
                `;
            });
        }

        function updateTokens() {
            document.querySelectorAll('.player-token').forEach(t => t.remove());
            players.forEach((p, i) => {
                const blockId = realBlockIds[p.posIndex];
                const blockDiv = document.getElementById(`block-${blockId}`);
                const token = document.createElement('div');
                token.className = 'player-token';
                token.style.backgroundColor = p.color;
                token.style.left = (i * 8) + 'px';
                blockDiv.appendChild(token);
            });
        }

        function getCol(i) { return ['#e74c3c', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c'][i]; }
    </script>
</body>
</html>
