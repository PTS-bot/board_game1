<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Math Island - Classroom Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --water: #2980b9; --land: #f1c40f; --empty: #3498db; }
        body { font-family: 'Kanit', sans-serif; background: #2c3e50; margin: 0; display: flex; height: 100vh; color: white; overflow: hidden; }
        .hidden { display: none !important; }

        /* --- Sidebar ข้อมูลผู้เล่น --- */
        #sidebar { width: 300px; background: rgba(0,0,0,0.8); padding: 20px; border-right: 2px solid #444; overflow-y: auto; }
        .player-card { 
            background: #444; border-radius: 10px; padding: 15px; margin-bottom: 15px; 
            border: 3px solid transparent; position: relative; transition: 0.3s;
        }
        .player-card.active { border-color: #f1c40f; transform: scale(1.02); box-shadow: 0 0 15px #f1c40f; }
        .player-card h3 { margin: 0; font-size: 18px; }
        .player-card .money { color: #2ecc71; font-weight: bold; font-size: 20px; }
        .player-card .pos-info { font-size: 12px; color: #bdc3c7; }
        .player-card .items { font-size: 11px; margin-top: 5px; color: #e67e22; }
        .dice-icon { position: absolute; right: 10px; top: 10px; font-size: 24px; animation: bounce 0.5s infinite alternate; }

        /* --- พื้นที่กระดานเกม --- */
        #main-game { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #2c3e50; position: relative; }
        #board-container { 
            display: grid; 
            grid-template-columns: repeat(8, 70px); 
            grid-template-rows: repeat(8, 70px); 
            border: 5px solid #1a5276; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .block { display: flex; align-items: center; justify-content: center; font-size: 40px; position: relative; cursor: pointer; user-select: none; }
        .block.white { background: #f0d9b5; }
        .block.black { background: #b58863; }
        .block.highlight { box-shadow: inset 0 0 20px rgba(46, 204, 113, 0.8); }
        .block.selected { background: #f1c40f !important; }
        .block.attack { box-shadow: inset 0 0 20px rgba(231, 76, 60, 0.8); }
        
        .piece { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 10; transition: transform 0.2s; font-size: 50px;}
        .piece:hover { transform: scale(1.1); }
        
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: fadein 0.3s, fadeout 0.3s 2.7s forwards;
            white-space: nowrap;
        }
        @keyframes fadein { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeout { from { opacity: 1; } to { opacity: 0; } }
        
        #turn-indicator {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 10px 30px;
            border-radius: 50px;
            background: #ecf0f1;
            color: #2c3e50;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        /* สไตล์สำหรับกล่องด้านบนกลาง */
        #top-center-info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        #game-title-display {
            font-size: 32px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 0;
            background: rgba(0,0,0,0.5);
            padding: 5px 20px;
            border-radius: 10px;
        }
        
        /* สไตล์ไอคอนหมากที่เหลือ */
        .remaining-pieces {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            margin-top: 8px;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 5px;
            min-height: 24px;
        }
        .remaining-pieces span {
            font-size: 18px;
            line-height: 1;
        }
    </style>
    <!-- Include Configuration File -->
    <script src="board_config.js"></script>
    <!-- โหลดสคริปต์เกมของหมากรุกแบบใหม่ -->
    <script src="chess_logic.js"></script>
</head>
<body>
    <div id="toast-container"></div>

    <div id="lobby-view" style="position: absolute; width: 100%; height: 100%; background: #2c3e50; z-index: 100; display: flex; align-items: center; justify-content: center;">
        <div style="background: white; color: #333; padding: 30px; border-radius: 20px; width: 400px; text-align: center;">
            <h2>♟️ CHESS GAME SETUP</h2>
            <div id="setup-offline">
                <h2>🎮 สมรภูมิหมากรุกคณิตศาสตร์</h2>
            
            <div style="margin-bottom: 20px; text-align: left; padding: 10px; background: #ecf0f1; border-radius: 10px;">
                <label style="font-weight: bold; color: #2c3e50;">ชื่อเกม (Folder Name):</label><br>
                <input type="text" id="game-name" value="math01" style="width: 100%; padding: 8px; margin-top: 5px;" placeholder="เช่น math01"><br><br>

                <label style="font-weight: bold; color: #2c3e50;">ระดับชั้นปี (ตัวเลข 1-6):</label><br>
                <input type="number" id="grade-level" style="width: 100%; padding: 8px; margin-top: 5px;" placeholder="เช่น 4" min="1" max="6"><br><br>
            </div>

            <input type="hidden" id="off-count" value="2">
            <input type="hidden" id="start-salary" value="0">
                
                <div id="off-names-list" style="margin: 15px 0;"></div>
                <button class="btn-roll" onclick="startOfflineGame()">เริ่มเกมในห้องเรียน</button>
            </div>
        </div>
    </div>

    <div id="main-game" class="hidden">
        <!-- Top Center Player Status -->
        <div id="top-center-info" style="display: flex; gap: 20px; width: 100%; max-width: 800px; justify-content: center; margin-bottom: 20px;">
            <div id="player-status-container" style="display: flex; gap: 20px; width: 100%;"></div>
        </div>

        <!-- Menu Buttons in top right -->
        <div style="position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; align-items: flex-end;">
            <h2 id="game-title-display" style="font-size: 24px; font-weight: bold; color: #f1c40f; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin: 0; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 10px; width: 100%; text-align: center; box-sizing: border-box;">เกาะคณิตศาสตร์</h2>
            <button onclick="endGame()" style="background: #c0392b; color: white; border: none; padding: 15px 20px; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; width: 100%;">🏁 จบเกม</button>
            <div style="display: flex; gap: 10px; width: 100%;">
                <button onclick="openInfoModal('character_abilities.html')" style="flex: 1; background: #e67e22; color: white; border: none; padding: 10px; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; white-space: nowrap;">🔥 ความสามารถ</button>
                <button onclick="openInfoModal('chess_rules.html')" style="flex: 1; background: #3498db; color: white; border: none; padding: 10px; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; white-space: nowrap;">📜 วิธีการเดินหมาก</button>
            </div>
        </div>
        <div id="board-container">
            <!-- Board will be generated by JS -->
        </div>
        
        <!-- Dev Testing Buttons -->
        <div style="margin-top: 20px; opacity: 0.5; display:none;">
            <button onclick="fetchQuestionAndShow(1)" style="font-size: 12px; margin: 2px;">Test L1</button>
            <button onclick="fetchQuestionAndShow(2)" style="font-size: 12px; margin: 2px;">Test L2</button>
            <button onclick="fetchQuestionAndShow(3)" style="font-size: 12px; margin: 2px;">Test L3</button>
            <button onclick="fetchQuestionAndShow(4)" style="font-size: 12px; margin: 2px;">Test L4</button>
        </div>
    </div>

    <!-- Modal Leaderboard (สรุปผลเกม) -->
    <div id="leaderboard-modal" class="hidden" style="position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 300; display: flex; align-items: center; justify-content: center; flex-direction: column;">
        <h1 style="color: #f1c40f; font-size: 48px; margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(241, 196, 15, 0.5);">🏆 สรุปผลการแข่งขัน</h1>
        <div id="leaderboard-list" style="background: white; color: #333; padding: 30px; border-radius: 15px; width: 80%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <!-- List goes here -->
        </div>
        <button onclick="location.reload()" class="btn-roll" style="margin-top: 30px; font-size: 24px; padding: 15px 40px;">เล่นเกมใหม่</button>
    </div>

    <!-- Modal ถามคำถาม -->
    <div id="question-modal" class="hidden" style="position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; display: flex; align-items: center; justify-content: center;">
        <div style="background: white; color: #333; padding: 20px; border-radius: 15px; width: 80%; max-width: 600px; text-align: center; position: relative;">
            <div id="timer-display" style="position: absolute; top: 10px; right: 20px; font-size: 24px; font-weight: bold; color: #e74c3c;">⏳ 0</div>
            <h2 id="question-title">โจทย์คณิตศาสตร์</h2>
            <div id="frame-container" style="width: 100%; height: 400px; background: #ecf0f1; margin-bottom: 20px; position: relative; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center;">
                <img id="question-image" src="" alt="Question Image" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; display: none;" onerror="this.onerror=null; this.style.display='none'; document.getElementById('frame-image').style.display='none'; document.getElementById('question-no-img').style.display='block';">
                <img id="frame-image" src="" alt="Frame Image" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 2; pointer-events: none; display: none;">
                <div id="question-no-img" style="color: #7f8c8d; font-size: 18px; z-index: 3; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 5px;">[ พื้นที่แสดงรูปโจทย์ (ถ้าไม่มีรูป) ]</div>
            </div>
            
            <div id="question-choices" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;"></div>
            
            <div id="subjective-input" class="hidden" style="margin-top: 15px;">
                <input type="text" id="answer-input" placeholder="พิมพ์คำตอบ..." style="padding: 10px; font-size: 18px; width: 60%; text-align: center;">
                <br>
                <button onclick="submitSubjectiveAnswer()" style="margin-top: 10px; padding: 10px 20px; font-size: 18px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer;">ส่งคำตอบ</button>
            </div>
        </div>
    </div>

    <!-- Info Modal Box -->
    <div id="info-modal" class="hidden" style="position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 400; display: flex; align-items: center; justify-content: center;">
        <div style="background: white; color: #333; padding: 30px; border-radius: 15px; width: 80%; max-width: 700px; max-height: 80vh; overflow-y: auto; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <button onclick="document.getElementById('info-modal').classList.add('hidden')" style="position: absolute; top: 15px; right: 20px; background: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s;">❌ ปิด</button>
            <div id="info-content"></div>
        </div>
    </div>



    <script src="chess_logic.js"></script>
    <script>
        const socket = io();
        let players = [];
        let turnColor = 'white'; // white or black
        
        // ตัวแปรเก็บข้อมูล Multi-game และ Log
        let activeGameName = "math01";
        let activeGradeLevel = "";

        // เปิด Modal ข้อมูลที่มุมขวาบน
        async function openInfoModal(fileName) {
            try {
                // เติม cache-buster เพื่อไม่ให้โหลดไฟล์เก่ากรณีมีแก้ไข
                const res = await fetch(fileName + '?v=' + new Date().getTime());
                const html = await res.text();
                document.getElementById('info-content').innerHTML = html;
                document.getElementById('info-modal').classList.remove('hidden');
            } catch (e) {
                alert("ไม่สามารถโหลดเนื้อหาได้: " + e.message);
            }
        }

        function renderOffNames() {
            const count = 2; // บังคับ 2 คนสำหรับหมากรุก
            const container = document.getElementById('off-names-list');
            container.innerHTML = '';
            for(let i=1; i<=count; i++) {
                container.innerHTML += `<div style="text-align: left; margin-bottom: 5px;"><label style="font-weight: bold; color: #2c3e50;">ชื่อผู้เล่น ${i}:</label></div><input type="text" class="off-p-name" value="ผู้เล่น ${i}" style="width: 100%; margin-bottom: 15px; padding: 8px; box-sizing: border-box;"><br>`;
            }
        }
        renderOffNames();

        function startOfflineGame() {
            const gName = document.getElementById('game-name').value.trim();
            const gGrade = document.getElementById('grade-level').value.trim();
            
            if (!gName) {
                alert("กรุณาระบุชื่อโฟลเดอร์เกม เช่น math01");
                return;
            }
            if (!gGrade || isNaN(gGrade)) {
                alert("กรุณาระบุระดับชั้นปี เป็นตัวเลขเท่านั้น (เช่น 1, 2, 3)");
                return;
            }

            activeGameName = gName;
            activeGradeLevel = gGrade;
            document.getElementById('game-title-display').innerText = activeGameName;
            
            const inputs = document.querySelectorAll('.off-p-name');
            players = [
                { id: 0, name: inputs[0].value, color: 'white', isDefeated: false, actionLog: [] },
                { id: 1, name: inputs[1].value, color: 'black', isDefeated: false, actionLog: [] }
            ];
            
            document.getElementById('lobby-view').classList.add('hidden');
            document.getElementById('main-game').classList.remove('hidden');
            
            initChessBoard();
            updateUI();
        }

        function getRemainingPiecesHTML(color) {
            let pieces = [];
            // นับจำนวนหมากที่เหลืออยู่บนกระดานสำหรับสีนั้นๆ
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    const p = boardState[r][c];
                    if(p && p.color === color) {
                        pieces.push(p);
                    }
                }
            }
            
            // เรียงลำดับโชว์ King > Queen > Rook > Bishop > Knight > Pawn
            const order = { 'king': 6, 'queen': 5, 'rook': 4, 'bishop': 3, 'knight': 2, 'pawn': 1 };
            pieces.sort((a,b) => order[b.type] - order[a.type]);
            
            let html = '';
            // ไอคอนสำหรับแสดงผล ขาว=เทาอ่อนมีเงา, ดำ=ดำสนิท
            const textColor = color === 'white' ? '#ecf0f1' : '#111';
            const textShadow = color === 'white' ? '0 0 2px #000' : 'none';

            pieces.forEach(p => {
                const icon = color === 'white' ? PIECES[p.type].iconWhite : PIECES[p.type].iconBlack;
                html += `<span style="color: ${textColor}; text-shadow: ${textShadow};">${icon}</span>`;
            });
            return html;
        }

        function updateUI() {
            const container = document.getElementById('player-status-container');
            container.innerHTML = '';
            players.forEach((p) => {
                const isActive = (p.color === turnColor && !p.isDefeated);
                let cardStyle = p.isDefeated ? 'opacity: 0.5; filter: grayscale(100%);' : (isActive ? 'border: 3px solid #f1c40f; transform: scale(1.02); box-shadow: 0 0 15px #f1c40f;' : 'border: 3px solid transparent;');
                cardStyle += 'flex: 1; background: #444; border-radius: 10px; padding: 15px; position: relative; transition: 0.3s;';
                if(!p.isDefeated) {
                     cardStyle += 'border-top: 5px solid ' + (p.color==='white'?'#eee':'#333') + ';';
                }
                
                const remainingPiecesHTML = p.isDefeated ? '' : getRemainingPiecesHTML(p.color);
                
                container.innerHTML += `
                    <div style="${cardStyle}">
                        <h3 style="margin: 0; font-size: 18px;">${p.color==='white'?'⚪':'⚫'} ${p.name} ${p.isDefeated ? '💀 (แพ้)' : ''}</h3>
                        <div class="remaining-pieces">${remainingPiecesHTML}</div>
                    </div>
                `;
            });
        }



        async function endGame() {
            const listDiv = document.getElementById('leaderboard-list');
            listDiv.innerHTML = '';
            
            for (let index = 0; index < players.length; index++) {
                const p = players[index];
                const status = p.isDefeated ? '<span style="color:red; font-size:14px;">(โดนรุกฆาต 💀)</span>' : '<span style="color:green; font-size:14px;">(ผู้ชนะ 🏆)</span>';
                
                let downloadBtnHTML = `<span style="font-size:12px; color:gray;">กำลังบันทึก Log...</span>`;
                
                // ถ้านักเรียนคนนี้เคยตอบคำถาม ให้ทำการบันทึกลงเซิร์ฟเวอร์
                if (p.actionLog && p.actionLog.length > 0) {
                    try {
                        const res = await fetch('http://localhost:3000/api/saveGameLog', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                gameName: activeGameName,
                                gradeLevel: activeGradeLevel,
                                studentName: p.name,
                                logData: p.actionLog
                            })
                        });
                        const data = await res.json();
                        if (data.success) {
                            downloadBtnHTML = `<a href="${data.filePath}" download style="background:#3498db; color:white; padding:5px 10px; border-radius:5px; text-decoration:none; font-size:14px;">📥 โหลดประวัติ (.csv)</a>`;
                        } else {
                            downloadBtnHTML = `<span style="color:red; font-size:12px;">บันทึก Log ไม่สำเร็จ</span>`;
                        }
                    } catch (e) {
                        console.error('Error saving log for', p.name, e);
                        downloadBtnHTML = `<span style="color:red; font-size:12px;">Error เซิร์ฟเวอร์</span>`;
                    }
                } else {
                    downloadBtnHTML = `<span style="color:gray; font-size:12px;">ไม่ได้ทำโจทย์เลย</span>`;
                }

                listDiv.innerHTML += `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 2px dashed #ecf0f1; font-size: 20px;">
                        <div>
                            <span style="font-weight: bold;">${p.name} ${status}</span><br>
                            ${downloadBtnHTML}
                        </div>
                    </div>
                `;
            }

            document.getElementById('main-game').classList.add('hidden');
            document.getElementById('leaderboard-modal').classList.remove('hidden');
        }

        // --- ระบบดึงโจทย์จาก CSV ---
        let questionTimer = null;
        let correctAnswer = null;
        let activeBlockMetaData = null; // เก็บกฎที่รอกระทำหลังให้คำตอบ (เช่น penaltyModifier)
        let activeQuestionCategory = null; 

        // window.fetchQuestionForCombat ถูกเรียกโดย chess_logic.js เมื่อมีการโจมตี
        window.fetchQuestionForCombat = function(level, combatData) {
            activeBlockMetaData = combatData; // เก็บข้อมูลการโจมตี (attacker, defender, from, to)
            fetchQuestionAndShow(level);
        }

        function fetchQuestionAndShow(level) {
            const dir = `/all_game/${activeGameName}/img_L${level}`;
            const csvUrl = `${dir}/1.csv`; // ไฟล์หลักที่เก็บข้อมูลโจทย์ทั้งหมดของระดับนั้นไว้
            
            const imgElement = document.getElementById('question-image');
            const noImgElement = document.getElementById('question-no-img');
            const frameContainer = document.getElementById('frame-container');
            
            // โหลดกรอบรูป 1.png จาก img_role โดยให้ซ้อนทับกันพอดี
            const defenderRole = activeBlockMetaData && activeBlockMetaData.defenderPiece ? activeBlockMetaData.defenderPiece.type : 'pawn';
            const frameUrl = `/all_game/${activeGameName}/img_role/${defenderRole}/1.png`;
            
            const frameElement = document.getElementById('frame-image');
            if(frameElement) {
                frameElement.src = frameUrl;
                frameElement.style.display = 'block';
            }

            fetch(csvUrl)
                .then(res => {
                    if (!res.ok) throw new Error("File not found");
                    return res.text();
                })
                .then(csvText => {
                    // แยกแถวทั้งหมด ข้ามแถวที่ว่างเปล่า (รองรับทั้ง \r\n และ \n)
                    const rows = csvText.split(/\r?\n/).filter(line => line.trim() !== "");
                    
                    if (rows.length === 0) {
                        alert(`ไม่มีข้อมูลโจทย์ในไฟล์ ${csvUrl} ข้ามเทิร์นนี้ไป`);
                        endPlayerTurn();
                        return;
                    }
                    
                    // สุ่มเลือก 1 ข้อจากแถวทั้งหมด
                    const randomRowIndex = Math.floor(Math.random() * rows.length);
                    const selectedRow = rows[randomRowIndex];
                    
                    // index: 0=id, 1=type, 2=time, 3=answer, 4+=choices
                    const cols = selectedRow.split(',').map(c => c.trim());
                    const questionId = cols[0]; // ID ถูกใช้เพื่อดึงรูปภาพของข้อนั้น
                    const qType = cols[1]; 
                    const qTime = parseInt(cols[2]);
                    correctAnswer = cols[3]; 
                    const choices = cols.slice(4); 

                    // พยายามโหลดรูปโจทย์ ตาม ID
                    const imgUrl = `${dir}/${questionId}.png`;
                    imgElement.src = imgUrl; 
                    imgElement.style.display = 'block';
                    noImgElement.style.display = 'none';

                    document.getElementById('question-title').innerText = `โจทย์ Lv.${level} (${qType})`;
                    
                    setupQuestionUI(qType, choices);
                    startTimer(qTime);
                    
                    document.getElementById('question-modal').classList.remove('hidden');
                })
                .catch(err => {
                    console.error("Error loading question:", err);
                    alert(`ไม่พบไฟล์โจทย์ ${csvUrl} หรือเกิดข้อผิดพลาด (ข้ามตานี้ไปแทน)`);
                    endPlayerTurn(); 
                });
        }

        function setupQuestionUI(qType, choices) {
            const choicesContainer = document.getElementById('question-choices');
            const subjectiveContainer = document.getElementById('subjective-input');
            choicesContainer.innerHTML = '';
            
            if (qType === 'Objective_Test' || qType === 'true_or_false') {
                choicesContainer.style.display = 'flex';
                subjectiveContainer.classList.add('hidden');
                
                choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.innerText = choice;
                    btn.style.padding = '10px 20px';
                    btn.style.fontSize = '18px';
                    btn.style.cursor = 'pointer';
                    btn.style.border = '2px solid #3498db';
                    btn.style.borderRadius = '5px';
                    btn.style.background = '#ecf0f1';
                    btn.onmouseover = () => btn.style.background = '#bdc3c7';
                    btn.onmouseout = () => btn.style.background = '#ecf0f1';
                    btn.onclick = () => checkAnswer(choice === correctAnswer);
                    choicesContainer.appendChild(btn);
                });
            } else if (qType === 'Subjective_Test') {
                choicesContainer.style.display = 'none';
                subjectiveContainer.classList.remove('hidden');
                document.getElementById('answer-input').value = '';
            }
        }

        function submitSubjectiveAnswer() {
            const ans = document.getElementById('answer-input').value.trim();
            checkAnswer(ans.toLowerCase() === correctAnswer.toLowerCase());
        }

        function checkAnswer(isCorrect, isTimeout = false) {
            clearInterval(questionTimer);
            document.getElementById('question-modal').classList.add('hidden');
            
            let p = players.find(x => x.color === turnColor);
            let logStatus = isTimeout ? "หมดเวลา" : (isCorrect ? "ถูก" : "ผิด");

            // บันทึก Log การตอบคำถาม
            const qTitle = document.getElementById('question-title').innerText;
            p.actionLog.push({
                question: qTitle,
                level: activeBlockMetaData?.level || "N/A",
                status: logStatus
            });
            
            // เรียก handleCombatResult ใน chess_logic.js
            if(window.handleCombatResult) {
                window.handleCombatResult(isCorrect, activeBlockMetaData);
            }
            
            activeBlockMetaData = null; // คืนค่า
        }

        function startTimer(seconds) {
            clearInterval(questionTimer);
            let time = seconds;
            const display = document.getElementById('timer-display');
            display.innerText = `⏳ ${time}`;
            
            questionTimer = setInterval(() => {
                time--;
                display.innerText = `⏳ ${time}`;
                if (time <= 0) {
                    clearInterval(questionTimer);
                    alert("⏰ หมดเวลา! ถือว่าตอบผิด");
                    checkAnswer(false, true); // หมดเวลาถือว่าตอบผิด และให้ param timeout=true
                }
            }, 1000);
        }
    </script>
</body>
</html>
